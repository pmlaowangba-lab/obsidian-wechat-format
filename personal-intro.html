<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人介绍</title>
    <link rel="stylesheet" href="./personal-intro.css" />
  </head>
  <body>
    <main class="profile-page">
      <section class="profile-card">
        <div class="photo-panel">
          <div class="photo-placeholder">
            <span>照片位置</span>
            <small>可替换为个人照片</small>
          </div>
        </div>

        <div class="content-panel">
          <p class="eyebrow">Personal Profile</p>
          <h1>你的姓名</h1>
          <p class="summary">
            你好，我是一名热爱学习与分享的从业者，关注设计、技术与效率工具，希望持续做出有价值的内容与作品。
          </p>

          <section class="info-block">
            <h2>自我介绍</h2>
            <p>
              这里可以填写更详细的个人介绍，例如你的职业方向、兴趣爱好、擅长领域，或者你希望别人快速了解你的几句话。
            </p>
          </section>

          <section class="info-block">
            <h2>联系方式</h2>
            <ul class="contact-list">
              <li>邮箱：yourname@example.com</li>
              <li>电话：138-0000-0000</li>
              <li>微信：your_wechat</li>
            </ul>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
